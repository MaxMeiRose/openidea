name: Feature dev delivery

on:
  push:
    branches: [feature-dev]
    paths-ignore:
      - "docs/**"
      - "**/AGENTS.md"
      - ".agents/**"
      - ".claude/**"
      - "README*.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/assets/**"
      - ".github/pull_request_template.md"
  schedule:
    # 10:17 China time. Scheduled workflows run from the default branch.
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if this commit already has a published Windows installer"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: feature-dev-delivery
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  prepare:
    if: github.repository == 'MaxMeiRose/openidea' && github.ref == 'refs/heads/feature-dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      build: ${{ steps.build.outputs.build }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'schedule' && 'feature-dev' || github.sha }}
          fetch-depth: ${{ github.event_name == 'schedule' && '0' || '1' }}
          filter: blob:none
      - name: Merge both upstreams into feature-dev
        id: merge
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add original https://github.com/l0ng-ai/openidea.git
          git remote add dekwan https://github.com/dekwanlabs/openidea.git
          git fetch original main --no-tags
          git fetch dekwan main feature/dev --no-tags
          before=$(git rev-parse HEAD)
          for upstream in original/main dekwan/main dekwan/feature/dev; do
            if ! git merge --no-ff --no-edit "$upstream"; then
              echo "::error::Merge from $upstream has conflicts. Resolve them locally on feature-dev and push; the branch was not updated."
              git diff --name-only --diff-filter=U >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "$upstream: $(git rev-parse "$upstream")" >> "$GITHUB_STEP_SUMMARY"
          done
          after=$(git rev-parse HEAD)
          echo "sha=$after" >> "$GITHUB_OUTPUT"
          if [ "$before" = "$after" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "code_changed=false" >> "$GITHUB_OUTPUT"
          else
            changed_files=$(git diff --name-only "$before" "$after")
            docs='(^docs/|(^|/)AGENTS\.md$|^\.agents/|^\.claude/|^README[^/]*\.md$|^CONTRIBUTING\.md$|^SECURITY\.md$|^\.github/ISSUE_TEMPLATE/|^\.github/assets/|^\.github/pull_request_template\.md$)'
            code_changes=$(printf '%s\n' "$changed_files" | grep -Ev "$docs" || true)
            if [ -n "$code_changes" ]; then
              echo "code_changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "code_changed=false" >> "$GITHUB_OUTPUT"
            fi
            git push origin HEAD:feature-dev
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "feature-dev: $after" >> "$GITHUB_STEP_SUMMARY"
      - name: Select the source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Skip unnecessary Windows builds
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          UPSTREAM_CHANGED: ${{ steps.merge.outputs.changed }}
          CODE_CHANGED: ${{ steps.merge.outputs.code_changed }}
          FORCE_BUILD: ${{ inputs.force }}
        shell: bash
        run: |
          set -euo pipefail
          skip() {
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "$1" >> "$GITHUB_STEP_SUMMARY"
          }
          if [ "$EVENT_NAME" = schedule ] && [ "$UPSTREAM_CHANGED" != true ]; then
            skip "No new upstream commits; no Windows runner is needed."
            exit 0
          fi
          if [ "$EVENT_NAME" = schedule ] && [ "$CODE_CHANGED" != true ]; then
            skip "Only upstream documentation changed; no Windows runner is needed."
            exit 0
          fi
          sha=$(git rev-parse HEAD)
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/feature-dev" --jq .object.sha)
          if [ "$sha" != "$latest" ]; then
            skip "$sha has been superseded by $latest; no Windows runner is needed."
            exit 0
          fi
          if [ "$FORCE_BUILD" != true ]; then
            delivered=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '
              .[] | select(.draft == false)
              | select(.tag_name | test("^feature-dev-[a-f0-9]{12}-[0-9]+-[0-9]+$"))
              | select(any(.assets[]; .name == "build-info.json" and .state == "uploaded" and .size > 0))
              | select(any(.assets[]; (.name | test("^OpenIDEA_.*_x64-setup\\.exe$")) and .state == "uploaded" and .size > 0))
              | .target_commitish')
            if printf '%s\n' "$delivered" | grep -Fxq "$sha"; then
              skip "$sha already has a published Windows installer; use force only for an intentional rebuild."
              exit 0
            fi
          fi
          echo "build=true" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v5
        if: steps.build.outputs.build == 'true'
        with: { version: 11.28.11 }
      - uses: actions/setup-node@v5
        if: steps.build.outputs.build == 'true'
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
        if: steps.build.outputs.build == 'true'
      - run: pnpm typecheck
        if: steps.build.outputs.build == 'true'
      - run: pnpm lint
        if: steps.build.outputs.build == 'true'
      - run: pnpm format:check
        if: steps.build.outputs.build == 'true'
      - run: pnpm knip
        if: steps.build.outputs.build == 'true'
      - run: pnpm test --maxWorkers=2
        if: steps.build.outputs.build == 'true'

  windows:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: pnpm/action-setup@v5
        with: { version: 11.28.11 }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        id: toolchain
      - uses: actions/cache/restore@v4
        id: debug-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: openidea-debug-v1-windows-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: openidea-debug-v1-windows-${{ steps.toolchain.outputs.cachekey }}-
      - run: pnpm install --frozen-lockfile
      - name: Generate IPC bindings
        id: bindings
        timeout-minutes: 45
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          cargo test --locked --timings -p openidea --test export_bindings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "generated=true" >> $env:GITHUB_OUTPUT
          git diff --exit-code src/bindings.ts
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: failure() && steps.bindings.outputs.generated == 'true'
        with:
          name: generated-bindings
          path: src/bindings.ts
          retention-days: 7
      - name: Test Rust integration
        timeout-minutes: 45
        shell: pwsh
        run: |
          # Provider fixtures use sh, which Git for Windows supplies outside Git/cmd.
          $env:PATH = 'C:\Program Files\Git\bin;' + $env:PATH
          # Test repositories and worktrees use LF fixtures, as in upstream CI.
          git config --global core.autocrlf false
          cargo test --locked --timings --no-fail-fast -p ide-agent -p ide-http -p ide-run -p openidea --lib
          exit $LASTEXITCODE
      - uses: actions/cache/save@v4
        if: >-
          !cancelled() && steps.bindings.outputs.generated == 'true' &&
          steps.debug-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: ${{ steps.debug-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cargo-timings
          path: target/cargo-timings/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/cache/restore@v4
        id: release-cache
        with:
          path: target/release
          key: openidea-release-v1-windows-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: openidea-release-v1-windows-${{ steps.toolchain.outputs.cachekey }}-
      - name: Build Windows installer for the fork channel
        id: package
        shell: pwsh
        run: |
          # Keep the installed identity. Updates are delivered by the local task,
          # so the official in-app updater must not overwrite the fork.
          $config = @{
            bundle = @{ createUpdaterArtifacts = $false; windows = @{ nsis = @{ installMode = 'currentUser' } } }
            plugins = @{ updater = @{ endpoints = @() } }
          }
          $configPath = Join-Path $env:RUNNER_TEMP 'feature-dev-tauri.json'
          $config | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $configPath -Encoding utf8
          pnpm tauri build --bundles nsis --config $configPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "built=true" >> $env:GITHUB_OUTPUT
      - uses: actions/cache/save@v4
        if: >-
          !cancelled() && steps.package.outputs.built == 'true' &&
          steps.release-cache.outputs.cache-hit != 'true'
        with:
          path: target/release
          key: ${{ steps.release-cache.outputs.cache-primary-key }}
      - name: Publish tested Windows prerelease
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $commit = (git rev-parse HEAD).Trim()
          $tag = "feature-dev-$($commit.Substring(0, 12))-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $installer = Get-Item -LiteralPath "target/release/bundle/nsis/OpenIDEA_${version}_x64-setup.exe"
          # Tauri restores the unpatched build output after packaging; hash the installed file.
          $extractPath = Join-Path $env:RUNNER_TEMP 'feature-dev-package-content'
          & 'C:\Program Files\7-Zip\7z.exe' x $installer.FullName "-o$extractPath" -y openidea.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $packagedExecutable = Join-Path $extractPath 'openidea.exe'
          if (!(Test-Path -LiteralPath $packagedExecutable)) { throw 'Installer is missing openidea.exe' }
          $manifestPath = Join-Path $env:RUNNER_TEMP 'build-info.json'
          @{
            schema = 1
            repository = $env:GITHUB_REPOSITORY
            branch = 'feature-dev'
            commit = $commit
            tag = $tag
            version = $version
            platform = 'windows-x86_64'
            installerName = $installer.Name
            installerSha256 = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            executableSha256 = (Get-FileHash -LiteralPath $packagedExecutable -Algorithm SHA256).Hash.ToLowerInvariant()
            runUrl = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          } | ConvertTo-Json | Set-Content -LiteralPath $manifestPath -Encoding utf8
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          "Windows x64 build of feature-dev at $commit. IPC generation, Rust integration tests, frontend typecheck, lint and tests passed. Install with the local feature-dev update task." |
            Set-Content -LiteralPath $notesPath -Encoding utf8
          gh release create $tag $installer.FullName $manifestPath --repo $env:GITHUB_REPOSITORY --target $commit --draft --prerelease --latest=false --title "OpenIDEA feature-dev $($commit.Substring(0, 12))" --notes-file $notesPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "Release: https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$tag" >> $env:GITHUB_STEP_SUMMARY
